const slides=[...document.querySelectorAll('.slide')],prev=document.getElementById('prev'),next=document.getElementById('next'),stage=document.getElementById('stage');let current=0;
function select(index){if(index<0||index>=slides.length||index===current)return;current=index;slides.forEach((slide,i)=>slide.hidden=i!==current);document.getElementById('number').textContent=String(current+1).padStart(2,'0');prev.disabled=current===0;next.disabled=current===slides.length-1;if(document.activeElement===prev&&prev.disabled)next.focus();else if(document.activeElement===next&&next.disabled)prev.focus();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)slides[current].animate([{opacity:.4,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{duration:250,easing:'ease-out'});}
prev.onclick=()=>select(current-1);next.onclick=()=>select(current+1);document.querySelector('.explorer').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();select(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();select(current-1);}});let start;stage.addEventListener('touchstart',e=>{start={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});stage.addEventListener('touchend',e=>{if(!start)return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)select(current+(dx<0?1:-1));start=null;},{passive:true});stage.addEventListener('touchcancel',()=>start=null);
</script><script src="js/music.js"></script></body></html>
